[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shamtrace"
version = "0.2.0"
description = "Evidence-first web security configuration and surface assessment CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.27,<1",
    "rich>=13,<15",
    "dnspython>=2.6,<3",
]
keywords = ["security", "assessment", "reconnaissance", "headers", "tls", "dns", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
shamtrace = "shamtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
